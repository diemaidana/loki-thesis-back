spring.application.name=Plataforma de compra/venta

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hightlight_sql=true

spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.health.show-details=always

server.port=8080

app.uploads.dir=./uploads

# Mail configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME}
app.frontend.url=${APP_FRONTEND_URL}

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}
app.jwt.issuer=loki-thesis
app.jwt.audience=loki-frontend

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.auth.max-failed-attempts=3
app.auth.lockout-duration-minutes=15
app.auth.lock-notification-throttle-hours=48
